[project]
name = "weather-risk-agent"
version = "0.1.0"
description = "Conversational agent that ranks logistics hubs by weather disruption exposure"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.45",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
